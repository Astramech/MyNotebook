# Copy these values from the Supabase project dashboard.
# Use the transaction-pooler Postgres connection string for SUPABASE_DB_URL.
SUPABASE_DB_URL = "postgresql://..."
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "YOUR_SERVER_SIDE_SECRET_KEY"
SUPABASE_STORAGE_BUCKET = "mynotebook-assets"

# Fill this after Streamlit Community Cloud assigns the app URL.
MYNOTEBOOK_PUBLIC_URL = "https://YOUR-APP.streamlit.app"

# Optional: makes the same AI provider available on every device.
DEEPSEEK_API_KEY = ""
OPENAI_API_KEY = ""
